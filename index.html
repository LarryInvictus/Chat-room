<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracy Chat Room</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #f0f0f0; padding: 20px; display: flex; justify-content: center; }
        #chat-container { width: 600px; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; color: #4da6ff; }
        
        #chat-box { height: 350px; overflow-y: auto; border: 1px solid #444; background: #1a1a1a; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .message { margin-bottom: 10px; line-height: 1.4; }
        .system-message { color: #ffcc00; font-style: italic; font-size: 0.9em; text-align: center; display: block; margin: 10px 0; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex-grow: 1; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        input#username { width: 120px; flex-grow: 0; }
        
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button#send-btn { background: #4da6ff; color: #000; }
        button#send-btn:hover { background: #3399ff; }
        
        button#vote-btn { background: #ff4d4d; color: white; width: 100%; font-size: 1.1em; }
        button#vote-btn:hover { background: #ff3333; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>Voting Chat Room</h2>
    <div id="chat-box"></div>
    
    <div class="input-group">
        <input type="text" id="username" placeholder="Name" value="Guest">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
    
    <button id="vote-btn">Vote to Reset Chat</button>
</div>

<script>
    const socket = new WebSocket('ws://localhost:8080');
    
    const chatBox = document.getElementById('chat-box');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('message-input');
    
    // Handle incoming messages from the server
    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.type === 'chat') {
            appendHTML(`<div class="message"><strong>${data.user}:</strong> ${data.text}</div>`);
        } else if (data.type === 'system') {
            appendHTML(`<span class="system-message">[System] ${data.text}</span>`);
        } else if (data.type === 'reset') {
            chatBox.innerHTML = ''; // Wipes the chat clean
            appendHTML('<span class="system-message">[System] Chat has been cleared by unanimous vote.</span>');
        }
    };

    // Helper to safely append elements and scroll to bottom
    function appendHTML(htmlString) {
        chatBox.insertAdjacentHTML('beforeend', htmlString);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Send chat message
    function sendMessage() {
        const user = usernameInput.value.trim() || 'Guest';
        const text = messageInput.value.trim();
        
        if (text !== '') {
            socket.send(JSON.stringify({ type: 'chat', user: user, text: text }));
            messageInput.value = '';
        }
    }

    // Event Listeners
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Send vote message
    document.getElementById('vote-btn').addEventListener('click', () => {
        socket.send(JSON.stringify({ type: 'vote' }));
    });
</script>

</body>
</html>
